<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ツンデレ彼女AR</title>
    <!-- Model Viewerの読み込み -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; text-align: center; font-family: sans-serif; background: #f0f0f0; }
        model-viewer { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <!-- 動画をテクスチャとして貼り付けた板などを表示するか、ARクイックルック等で動画を表示する設定 -->
    <model-viewer src="" poster="ar-preview.jpg" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" shadow-intensity="1">
    </model-viewer>
</body>
</html>
